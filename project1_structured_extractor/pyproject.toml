[project]
name = "project1-structured-extractor"
version = "0.1.0"
description = "Structured AI Data Extractor and Ticket Classifier using Pydantic and LLMs"
readme = "NOTES.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "google-genai>=0.1.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

